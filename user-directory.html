<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory - Lesson 12</title>
    <link rel="stylesheet" href="user-directory.css">
    <script src="user-directory.js" defer></script>
</head>
<body>
    <main id="app">
        <header>
            <h1>User Directory</h1>
            <p>Search, sort and filter users</p>
        </header>

        <!-- Search and filter controls -->
        <section class="controls">
            <input
                type="search"
                id="search"
                placeholder="Search by name or email..."
            >

            <select id="sort">
                <option value="az">Sort: A to Z</option>
                <option value="za">Sort: Z to A</option>
            </select>

            <select id="city-filter">
                <option value="all">All Cities</option>
            </select>
        </section>

        <p id="loading">Loading users...</p>
        <p id="error" class="hidden"></p>
        <p id="result-count"></p>

        <section id="users-container"></section>
    </main>
</body>
</html>
